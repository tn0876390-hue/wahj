<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wahj - وهج</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#fdfbf7;color:#2d2a26;text-align:center;min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;padding:18px;font-weight:800;font-size:20px;border-bottom:1px solid #f0e6d3;letter-spacing:1px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 20px}
h1{font-size:72px;font-weight:800;line-height:.9}
h1 small{display:block;font-size:13px;letter-spacing:8px;color:#b8a99a;font-weight:400;margin-top:10px}
.tag{margin-top:20px;font-size:20px;color:#2d2a26}
.sub{margin-top:10px;color:#8a847e;font-size:15px;line-height:1.7;max-width:320px}
.btn{margin-top:30px;background:#2d2a26;color:#fff;padding:14px 36px;border-radius:40px;text-decoration:none;font-weight:700;display:inline-block}
.notify{margin-top:25px;background:#fff;border:1px solid #f1e9d9;border-radius:14px;padding:12px 18px;font-size:13px;color:#8a847e}
footer{padding:25px;color:#bbb;font-size:11px}
</style>
</head>
<body>
<div class="top">وهج</div>

<div class="hero">

<div class="notify">✨ سيتم إطلاق المنصة قريباً - ترقبونا</div>
</div>

<footer>© 2026 Wahj - وهج</footer>
